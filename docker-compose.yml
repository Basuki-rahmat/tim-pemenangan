# ============================================================================
# Docker Compose — Blueprint Infrastruktur Tim Pemenangan (Prototype -> Multi Server)
#
#   api      -> Node.js Express (Producer: presigned URL + push BullMQ)
#   worker   -> Worker BullMQ (batch insert MySQL)
#   mysql    -> MySQL 8 Primary (schema + seed dari docker/mysql-init)
#   redis    -> Redis 7 (BullMQ queue + idempotency)
#   minio    -> S3-compatible Object Storage (bucket c1-uploads)
#
# Jalankan (butuh Docker Desktop / Docker Engine):
#   docker compose up -d --build
#
# Service di belakang docker network "tim-pemenangan_default":
#   mysql / redis / minio / api / worker — API & worker saling tembus dgn nama service
# ============================================================================
name: tim-pemenangan

services:
  mysql:
    image: mysql:8.0
    container_name: tp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-db_pemilu_c1}
      MYSQL_USER: ${DB_USER:-c1_user}
      MYSQL_PASSWORD: ${DB_PASS:-c1_secret}
      TZ: Asia/Jakarta
    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-redo-log-capacity=256M
      - --innodb-doublewrite=ON
      - --max-connections=1000
      - --max-allowed-packet=64M
      - --skip-name-resolve=ON
    ports:
      - "${MYSQL_PORT:-3307}:3306"       # host 3307 agar tidak bentrok Laragon 3306
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_secret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: tp-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"       # host 6380 agar tidak bentrok Redis Laragon 6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    container_name: tp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9002}:9000"       # host 9002 agar tidak bentrok MinIO lokal 9000
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # one-shot: buat bucket + set ACL download (public GET) saat volume baru
  minio-init:
    image: quay.io/minio/minio:latest
    container_name: tp-minio-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        mc alias set local http://minio:9000 $${S3_ACCESS_KEY:-minioadmin} $${S3_SECRET_KEY:-minioadmin} >/dev/null 2>&1
        mc mb --ignore-existing local/$${S3_BUCKET:-c1-uploads} >/dev/null 2>&1
        mc anonymous set download local/$${S3_BUCKET:-c1-uploads}
        echo "minio-init: bucket ready + public download OK"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-c1-uploads}
    depends_on:
      minio:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: tp-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-c1_user}
      DB_PASS: ${DB_PASS:-c1_secret}
      DB_NAME: ${DB_NAME:-db_pemilu_c1}
      DB_REPLICA_HOST: mysql
      DB_REPLICA_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9002}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-c1-uploads}
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:3000"         # host 3001 agar tidak bentrok API Laragon 3000

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: tp-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-c1_user}
      DB_PASS: ${DB_PASS:-c1_secret}
      DB_NAME: ${DB_NAME:-db_pemilu_c1}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:${MINIO_PORT:-9002}
      S3_BUCKET: ${S3_BUCKET:-c1-uploads}
      PBATCH_SIZE: 500
      PFLUSH_INTERVAL_MS: 1000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  mysql-data:
  redis-data:
  minio-data: