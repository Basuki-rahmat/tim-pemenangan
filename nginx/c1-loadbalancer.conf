# ============================================================================
# [Issue #08] Konfigurasi Nginx Load Balancer & Rate Limiting
# Target Kapasitas: 29.000 TPS Terdistribusi ke Pool API Node.js
# ============================================================================

# 1. Definisi Zone Rate Limiting (Proteksi DDoS & Spam Submit C1)
# 10MB memory zone menampung ~160.000 state IP address
limit_req_zone $binary_remote_addr zone=c1_submit_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=c1_read_limit:10m rate=50r/s;

# 2. Pool Upstream API Cluster (Metode least_conn + Keepalive 64)
upstream api_c1_backend {
    least_conn; # Arahkan trafik ke instance dengan koneksi aktif paling sedikit

    # Pool 15-20 Instance VM API di VPC Private Network (10.0.2.x)
    # Untuk pengujian lokal di Laragon / Docker, gunakan localhost ports
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s backup;
    # server 10.0.2.11:3000 max_fails=3 fail_timeout=10s;
    # server 10.0.2.12:3000 max_fails=3 fail_timeout=10s;
    # server 10.0.2.13:3000 max_fails=3 fail_timeout=10s;
    # server 10.0.2.14:3000 max_fails=3 fail_timeout=10s;
    # server 10.0.2.15:3000 max_fails=3 fail_timeout=10s;

    # WAJIB: Pertahankan koneksi persistent TCP agar tidak overhead handshake baru
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name c1.tim-pemenangan.id localhost;

    # Optimalisasi Buffer & Payload JSON C1
    client_max_body_size 2M;
    client_body_buffer_size 128k;

    # Gzip Compression untuk Respon JSON Cepat
    gzip on;
    gzip_types text/plain application/json text/css application/javascript;
    gzip_min_length 1000;

    # Logging Akses dengan Format Latensi Upstream
    log_format c1_perf '$remote_addr - $remote_user [$time_local] '
                       '"$request" $status $body_bytes_sent '
                       'rt=$request_time urt=$upstream_response_time '
                       'uaddr=$upstream_addr';
    access_log logs/c1_access.log c1_perf;
    error_log  logs/c1_error.log warn;

    # ------------------------------------------------------------------------
    # Endpoint Write-Heavy: POST /api/c1/submit (Rate Limited + Fast Queue)
    # ------------------------------------------------------------------------
    location = /api/c1/submit {
        # Batasi lonjakan: burst 20 request per IP, tanpa delay untuk respons instan
        limit_req zone=c1_submit_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api_c1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection ""; # Wajib untuk keepalive upstream
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout pendek untuk fail-fast
        proxy_connect_timeout 3s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ------------------------------------------------------------------------
    # Endpoint Read-Heavy: GET /api/c1/rekapitulasi (Dashboard Publik)
    # ------------------------------------------------------------------------
    location /api/c1/ {
        limit_req zone=c1_read_limit burst=50 nodelay;

        proxy_pass http://api_c1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache mikro 2 detik untuk agregasi dashboard publik yang diakses massal
        proxy_cache_valid 200 2s;
    }

    # ------------------------------------------------------------------------
    # Static Frontend Assets (Web Dashboard & Form Simulasi)
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://api_c1_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
