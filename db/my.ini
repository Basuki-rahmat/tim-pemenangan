# ============================================================================
# KONFIGURASI MYSQL - LARAGON WINDOWS (my.ini)
# Issue #01: Setup Skema Database Dinamis & Optimasi High-Throughput
# Salin konfigurasi [mysqld] ini ke file my.ini Laragon Anda jika diperlukan:
# Lokasi Laragon: C:\laragon\bin\mysql\mysql-8.0.30-winx64\my.ini
# ============================================================================

[mysqld]
character-set-server = utf8mb4
collation-server     = utf8mb4_unicode_ci

# Buffer pool aman untuk perangkat lokal Windows (2 GB)
innodb_buffer_pool_size         = 2G
innodb_buffer_pool_instances     = 2

# Optimasi penulisan cepat tanpa lock disk pada setiap commit
innodb_flush_log_at_trx_commit  = 2

# Kompatibel Windows: unbuffered (JANGAN gunakan O_DIRECT di Windows karena akan crash)
innodb_flush_method             = unbuffered

# Koneksi aman untuk concurrency worker BullMQ
max_connections                 = 1000
max_allowed_packet              = 64M

# DNS bypass untuk performa koneksi lokal 127.0.0.1
skip-name-resolve               = 1

[client]
default-character-set = utf8mb4

[mysql]
default-character-set = utf8mb4
